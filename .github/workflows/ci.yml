# Phase 0 CI —— 与本地验证等价（typecheck → build → test → coverage 阈值 → 服务端冒烟）
# ⚠️ 状态：代码已推送到 Gitee；Gitee 不执行 GitHub Actions，workflow **仍未在真实 CI 跑过**（台账 D-13 / L-8）。
# 触发分支同时覆盖 master（Gitee 默认）与 main（GitHub 默认），并保留手动触发。
# 未引入 Turborepo（D-4）：用 pnpm -r 递归替代 `turbo build`。
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本读取自根 package.json 的 packageManager 字段（pnpm@12.6.0）

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 设计令牌门禁（纯源码文本比对，不构建、不联网）：
      #   tokens:check —— 设计稿变量导出 ↔ packages/tokens/src/tokens.css 的值比对
      #   color:check  —— 全仓硬编码色值扫描（覆盖 runtime / materials 等不进重构建链的包，
      #                   见 ADR-006 / L-5：它们刻意不进 `pnpm -r build`，但设计一致仍需守住）
      - name: Design tokens & color literals
        run: pnpm design:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # 覆盖率聚合（vitest workspace）：阈值见根 vitest.config.ts
      # lines/statements/functions ≥ 90（方案 9.2 硬指标）、branches ≥ 85（实测防退化）
      - name: Coverage (thresholds enforced)
        run: pnpm coverage

      # 服务端真实启动冒烟（B-15 教训：vitest 通过 ≠ 运行时可用）
      - name: Server smoke (real boot)
        run: |
          node apps/server/dist/main.js &
          SERVER_PID=$!
          sleep 3
          TOKEN=$(curl -sf -X POST http://localhost:3000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | node -e "process.stdin.on('data',d=>process.stdout.write(JSON.parse(d).accessToken))")
          test -n "$TOKEN"
          curl -sf http://localhost:3000/api/v1/auth/me -H "Authorization: Bearer $TOKEN"
          kill $SERVER_PID

      # 体积阈值告警（方案 9.2：超阈值只告警不失败）
      - name: Bundle size warning
        run: |
          SIZE_KB=$(du -sk packages/renderer/dist | cut -f1)
          echo "renderer dist = ${SIZE_KB}KB"
          if [ "$SIZE_KB" -gt 1024 ]; then
            echo "::warning::@lc/renderer dist 超过 1024KB（当前 ${SIZE_KB}KB），请检查是否引入了重依赖"
          fi
