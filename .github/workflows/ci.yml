# 远端 CI —— 与本地验证等价（typecheck → build → test → coverage 阈值 → 服务端冒烟 → 移动端编译）
# 触发分支同时覆盖 master（Gitee 默认）与 main（GitHub 默认），并保留手动触发。
# 未引入 Turborepo（D-4）：用 pnpm -r 递归替代 `turbo build`。
#
# 双 Node 版本：
# - verify（22）：全量门禁 + 覆盖率 + 真实启动冒烟 + H5/小程序/App 编译；
# - node20-core（20）：核心包兼容性回归。uni 的 vite 插件声明 Node >=22.12，
#   因此移动端编译只在 22 上跑；20 只验证服务端/渲染器/设计器核心链路。
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本读取自根 package.json 的 packageManager 字段（pnpm@12.6.0）

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 设计令牌门禁（纯源码文本比对，不构建、不联网）：
      #   tokens:check —— 设计稿变量导出 ↔ packages/tokens/src/tokens.css 的值比对
      #   color:check  —— 全仓硬编码色值扫描（覆盖 runtime / materials 等不进重构建链的包，
      #                   见 ADR-006 / L-5：它们刻意不进 `pnpm -r build`，但设计一致仍需守住）
      - name: Design tokens & color literals
        run: pnpm design:check

      # 先 build：workspace 包（schema/expression/renderer）的 package.json `types` 指向
      # dist/*.d.ts，全新检出时若先 typecheck 会报 “Cannot find module '@lc/schema'”。
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # 移动端三端编译：H5 / 微信小程序 / App（HBuilderX 可导入的 App 资源）。
      # App 的 apk/ipa 仍需 HBuilderX 原生打包，CI 只验证 uni 编译器能产出 app 资源。
      - name: Runtime H5 build
        run: pnpm -F @lc/runtime build:h5

      - name: Runtime WeChat mini-program build
        run: pnpm -F @lc/runtime build:mp-weixin

      - name: Runtime App build
        run: pnpm -F @lc/runtime build:app

      - name: Upload mobile build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runtime-mobile-${{ github.sha }}
          path: |
            packages/runtime/dist/build/mp-weixin
            packages/runtime/dist/build/app
          if-no-files-found: error
          retention-days: 7

      - name: Test
        run: pnpm test

      # 覆盖率聚合（vitest workspace）：阈值见根 vitest.config.ts
      # lines/statements/functions ≥ 90（方案 9.2 硬指标）、branches ≥ 85（实测防退化）
      - name: Coverage (thresholds enforced)
        run: pnpm coverage

      # 服务端真实启动冒烟（B-15 教训：vitest 通过 ≠ 运行时可用）
      - name: Server smoke (real boot)
        run: |
          node apps/server/dist/main.js &
          SERVER_PID=$!
          sleep 3
          TOKEN=$(curl -sf -X POST http://localhost:3000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | node -e "process.stdin.on('data',d=>process.stdout.write(JSON.parse(d).accessToken))")
          test -n "$TOKEN"
          curl -sf http://localhost:3000/api/v1/auth/me -H "Authorization: Bearer $TOKEN"
          kill $SERVER_PID

      # 安全加固冒烟：JWT fail-closed / CORS 白名单 / 登录限流（独立端口 3100/3103/3199）
      - name: Security smoke
        run: node apps/server/scripts/smoke-security.mjs

      # 可观测性冒烟：/health + /ready + X-Request-Id + 结构化访问日志（独立端口 3104）
      - name: Observability smoke
        run: pnpm smoke:observability

      # 体积阈值告警（方案 9.2：超阈值只告警不失败）
      - name: Bundle size warning
        run: |
          SIZE_KB=$(du -sk packages/renderer/dist | cut -f1)
          echo "renderer dist = ${SIZE_KB}KB"
          if [ "$SIZE_KB" -gt 1024 ]; then
            echo "::warning::@lc/renderer dist 超过 1024KB（当前 ${SIZE_KB}KB），请检查是否引入了重依赖"
          fi

  # Node 20 兼容性回归：Gitee 托管环境不能升到 22 时，至少服务端与核心包仍可构建/测试。
  # 移动端 uni 插件自身要求 Node >=22.12，故不在此 job 重复编译。
  node20-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 同 verify：workspace 包类型指向 dist，必须先 build 再 typecheck。
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
